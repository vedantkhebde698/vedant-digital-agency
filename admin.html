<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Private inquiry dashboard for V. Studio.">
    <title>Inquiry Dashboard | V. Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
    <script src="admin.js" defer></script>
</head>
<body>
    <header class="dashboard-header">
        <a class="brand" href="/">V<span>.</span>STUDIO</a>
        <a class="site-link" href="/">View website ↗</a>
    </header>
    <main class="dashboard-main">
        <section class="login-panel" id="login-panel" aria-labelledby="login-title" hidden>
            <span class="eyebrow">PRIVATE ADMIN AREA</span>
            <h1 id="login-title">Welcome back.</h1>
            <p>Sign in to manage customer project inquiries.</p>
            <form id="login-form">
                <label for="admin-password">Admin password</label>
                <input id="admin-password" name="password" type="password" autocomplete="current-password" required>
                <button class="button button-dark" type="submit">Sign in <span aria-hidden="true">↗</span></button>
                <p class="message" id="login-message" role="status" aria-live="polite"></p>
            </form>
        </section>

        <section class="dashboard" id="dashboard" hidden>
            <div class="dashboard-title">
                <div>
                    <span class="eyebrow">YOUR STUDIO, AT A GLANCE</span>
                    <h1>Inquiries<span>.</span></h1>
                </div>
                <button class="button button-outline" id="logout-button" type="button">Sign out</button>
            </div>

            <div class="stats-grid" aria-label="Inquiry summary">
                <article class="stat-card"><span>Total inquiries</span><strong id="total-count">0</strong></article>
                <article class="stat-card"><span>Needs a reply</span><strong id="new-count">0</strong></article>
                <article class="stat-card"><span>In progress</span><strong id="active-count">0</strong></article>
            </div>

            <div class="list-heading">
                <h2>Customer messages</h2>
                <label class="search-label">
                    <span class="sr-only">Search inquiries</span>
                    <input id="search-input" type="search" placeholder="Search inquiries">
                </label>
            </div>
            <p class="message" id="dashboard-message" role="status" aria-live="polite"></p>
            <div class="inquiry-list" id="inquiry-list" aria-live="polite"></div>
        </section>
    </main>
</body>
</html>
